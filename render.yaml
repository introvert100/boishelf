# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: boishelf
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - readandrich.com
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: BKASH_RECEIVE_NUMBER
        sync: false
      - key: BKASH_BUSINESS_ACCOUNT_CONFIRMED
        value: "false"
      - key: COD_COURIER_CONFIRMED
        value: "false"
      - key: MONITOR_TOKEN
        generateValue: true
      - key: SUPPORT_EMAIL
        sync: false
